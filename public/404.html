<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="light dark"/>
  <title>404 · MyFinHub</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10234d;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 18%,rgba(47,111,237,.14),transparent 34%),radial-gradient(circle at 84% 76%,rgba(37,185,215,.12),transparent 30%),linear-gradient(180deg,#f7f9fc,#f1f5fa)}
    main{width:min(820px,100%);display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:40px;align-items:center;padding:32px;border:1px solid #d9e2f0;border-radius:30px;background:#fff;box-shadow:0 18px 46px rgba(24,45,78,.1)}
    .visual{position:relative;aspect-ratio:1;border:1px solid #d9e2f0;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(47,111,237,.16),transparent 34%),linear-gradient(145deg,#fff,#eff5ff)}
    .grid{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(47,111,237,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,111,237,.07) 1px,transparent 1px);background-size:30px 30px}
    .line{position:absolute;left:15%;right:15%;top:52%;height:2px;background:repeating-linear-gradient(90deg,#2f6fed 0 10px,transparent 10px 18px);opacity:.55}
    .node{position:absolute;top:52%;width:42px;height:42px;margin-top:-21px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid #d9e2f0;box-shadow:0 4px 14px rgba(24,45,78,.08);font-weight:900}.a{left:10%;color:#174ea6}.b{left:50%;margin-left:-25px;width:50px;height:50px;margin-top:-25px;color:#d64058}.c{right:10%;color:#174ea6}
    .code{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:clamp(50px,10vw,78px);font-weight:900;letter-spacing:-.08em}.code b{color:#2f6fed}
    .eyebrow{color:#174ea6;font-size:11px;font-weight:850;letter-spacing:.13em}.copy{display:grid;gap:17px}.copy h1{margin:0;font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.05em}.copy p{margin:0;color:#70809d;font-size:14px;line-height:1.7}.safe{padding:12px 14px;border:1px solid rgba(29,154,104,.22);border-radius:14px;background:rgba(29,154,104,.07);font-size:11px;line-height:1.55}.action{width:max-content;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:10px;background:#2f6fed;color:#fff;text-decoration:none;font-size:12px;font-weight:800}
    @media(max-width:680px){main{grid-template-columns:1fr;padding:20px;border-radius:24px}.visual{width:min(320px,100%);justify-self:center}.copy{text-align:center;justify-items:center}.safe{text-align:left}}
    @media(prefers-color-scheme:dark){:root{color:#ecf3ff;background:#0d1627}body{background:radial-gradient(circle at 18% 18%,rgba(47,111,237,.18),transparent 34%),radial-gradient(circle at 84% 76%,rgba(37,185,215,.11),transparent 30%),#0d1627}main{background:#121f34;border-color:#31425d}.visual{background:radial-gradient(circle at 50% 45%,rgba(79,135,247,.2),transparent 34%),linear-gradient(145deg,#14233a,#101c30);border-color:#31425d}.node{background:#14233a;border-color:#3a4b66}.copy p{color:#a8b5c9}.safe{background:rgba(29,154,104,.12)}}
  </style>
</head>
<body>
  <main>
    <div class="visual" aria-hidden="true"><div class="grid"></div><div class="line"></div><span class="node a">→</span><span class="node b">?</span><span class="node c">⌂</span><div class="code">4<b>0</b>4</div></div>
    <section class="copy" aria-labelledby="title"><span class="eyebrow">404 · MYFINHUB</span><h1 id="title">Χάσαμε τη διαδρομή, όχι τα δεδομένα σου.</h1><p>Η σελίδα που ζήτησες δεν υπάρχει. Δεν εμφανίζονται οικονομικά στοιχεία σε αυτή την οθόνη.</p><div class="safe">Τα δεδομένα σου παραμένουν προστατευμένα. Επέστρεψε στην εφαρμογή από την ασφαλή αρχική διαδρομή.</div><a class="action" href="/#/dashboard">Επιστροφή στο Dashboard</a></section>
  </main>
</body>
</html>
