name: Release Vault Key Bootstrap

# One-shot release #88 trigger. Remove this workflow immediately after it reports its result.
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/release-vault-key-bootstrap.yml

permissions:
  contents: read
  statuses: write

jobs:
  configure:
    name: configure-production-card-vault-key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_PROJECT_NAME: rheom-iq
      VERCEL_TEAM_SLUG: mariosgiannakaras-projects
    steps:
      - name: Configure sensitive Vercel Production variables
        shell: bash
        run: |
          set -euo pipefail

          post_commit_status() {
            local state="$1"
            local description="$2"
            payload="$(STATE="$state" DESCRIPTION="$description" python - <<'PY'
          import json
          import os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "release/card-vault-bootstrap",
              "description": os.environ["DESCRIPTION"]
          }))
          PY
            )"
            curl --silent --show-error --fail \
              --request POST \
              --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/json' \
              --data-binary "$payload" \
              >/dev/null
          }

          post_commit_status pending "Configuring the initial Vercel Production card-vault key."

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            post_commit_status failure "Blocked: repository VERCEL_TOKEN secret is not configured."
            exit 10
          fi

          card_vault_key="$(openssl rand -hex 32)"
          echo "::add-mask::$card_vault_key"

          payload="$(CARD_VAULT_KEY="$card_vault_key" python - <<'PY'
          import json
          import os

          print(json.dumps([
              {
                  "key": "CARD_VAULT_KEY",
                  "value": os.environ["CARD_VAULT_KEY"],
                  "type": "sensitive",
                  "target": ["production"],
                  "comment": "RheomIQ AES-256-GCM card vault key; release #88"
              },
              {
                  "key": "CARD_VAULT_KEY_VERSION",
                  "value": "1",
                  "type": "sensitive",
                  "target": ["production"],
                  "comment": "RheomIQ card vault key version; release #88"
              }
          ]))
          PY
          )"

          endpoint="https://api.vercel.com/v10/projects/${VERCEL_PROJECT_NAME}/env?upsert=true&slug=${VERCEL_TEAM_SLUG}"

          http_code="$(curl --silent --show-error \
            --output /tmp/vercel-env-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url "$endpoint" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "$payload")"

          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            post_commit_status failure "Vercel environment update failed with HTTP ${http_code}."
            exit 12
          fi

          post_commit_status success "Sensitive Production card-vault variables configured."
