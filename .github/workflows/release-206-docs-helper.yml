name: Release 206 Docs Helper

on:
  push:
    branches: [release/206-v1.2.1]
    paths:
      - .github/workflows/release-206-docs-helper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/206-v1.2.1
          fetch-depth: 0
      - name: Update release documentation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release-206-docs.py
          grep -F '## [1.2.1] - 2026-08-22' CHANGELOG.md
          grep -F 'MyFinHub-Setup-1.2.1-x64.exe' README.md
          ! grep -F 'MyFinHub-Setup-1.2.0-x64.exe' README.md
      - name: Remove helper and commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-206-docs-helper.yml scripts/release-206-docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md
          git commit -m "docs: prepare MyFinHub v1.2.1 release notes"
          git push origin HEAD:release/206-v1.2.1
