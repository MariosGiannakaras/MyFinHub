name: Savings goal projection focused draft QA

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/588-savings-focused-qa.yml'
      - 'scripts/savings-remediation-qa.mjs'
      - 'src/pages/SavingsPage.tsx'
      - 'src/components/SavingsGoalProjectionPanel.tsx'
      - 'src/lib/goalProjections.ts'

permissions:
  contents: read

concurrency:
  group: savings-588-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  savings-browser:
    name: Advisory goal projections desktop and 375px
    if: ${{ github.event.pull_request.draft == true && github.head_ref == 'feat/588-savings-goal-projections-batch-e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Strict Chromium what-if no-mutation browser proof
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:web >/tmp/myfinhub-savings-vite.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          app_ready=0
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5173/qa.html >/dev/null; then app_ready=1; break; fi
            sleep 1
          done
          if [ "$app_ready" -ne 1 ]; then cat /tmp/myfinhub-savings-vite.log; exit 1; fi
          BROWSER="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$BROWSER" ]; then echo "Primary Chromium unavailable"; exit 1; fi
          export MYFINHUB_QA_PRIMARY_BROWSER="$BROWSER"
          export MYFINHUB_UX_EVIDENCE_DIR=/tmp/myfinhub-savings-focused
          primary_ready=0
          for attempt in 1 2; do
            rm -rf /tmp/myfinhub-savings-preflight
            "$BROWSER" --headless=new --remote-debugging-port=9306 --remote-debugging-address=127.0.0.1 --user-data-dir=/tmp/myfinhub-savings-preflight --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --no-default-browser-check about:blank >/tmp/myfinhub-savings-chrome.log 2>&1 &
            CHROME_PID=$!
            browser_ready=0
            for i in {1..100}; do
              if curl --fail --silent http://127.0.0.1:9306/json/version >/dev/null; then browser_ready=1; break; fi
              if ! kill -0 "$CHROME_PID" 2>/dev/null; then break; fi
              sleep .2
            done
            kill "$CHROME_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
            rm -rf /tmp/myfinhub-savings-preflight
            if [ "$browser_ready" -eq 1 ]; then primary_ready=1; break; fi
            tail -c 1200 /tmp/myfinhub-savings-chrome.log || true
            sleep .75
          done
          if [ "$primary_ready" -ne 1 ]; then echo "Primary Chromium failed strict startup"; exit 1; fi
          node scripts/qa-script-runner.mjs scripts/savings-remediation-qa.mjs
      - name: Upload savings advisory screenshots for direct review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myfinhub-focused-savings-${{ github.event.pull_request.head.sha }}
          path: /tmp/myfinhub-savings-focused/*.png
          if-no-files-found: warn
          retention-days: 14
