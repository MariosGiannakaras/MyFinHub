name: Windows Desktop Release

# Deliberate tag/manual release-only workflow. This file is never a normal PR gate.
on:
  push:
    tags: ['myfinhub-v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate installed Windows package before publication
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-windows.yml

  publish-desktop-release:
    name: publish-desktop-release
    if: startsWith(github.ref, 'refs/tags/myfinhub-v')
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Verify release tag and main ancestry
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Desktop releases must point to a commit already present on main.' }
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "myfinhub-v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Expected tag $expectedTag for desktop package version $version." }
      - name: Configure optional Windows signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)
          if ($hasPfx -xor $hasPassword) { throw 'Configure both Windows signing secrets or neither.' }
          if ($hasPfx) {
            $pfx = Join-Path $env:RUNNER_TEMP 'myfinhub-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            "CSC_LINK=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$($env:WINDOWS_SIGNING_PFX_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MYFINHUB_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "MYFINHUB_SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning 'Publishing an unsigned personal-use Windows release. Windows may show Unknown publisher / SmartScreen.'
          }
      - name: Build desktop release
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop
          npm run build
          npm run desktop:check
          npm run desktop:dist:from-dist
      - name: Verify installer integrity and optional Authenticode
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\desktop\MyFinHub-Setup-*-x64.exe | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Desktop installer artifact is missing.' }
          if ($installer.Length -lt 50MB -or $installer.Length -gt 350MB) { throw 'Desktop installer size is outside the accepted update range.' }
          if ($env:MYFINHUB_SIGNING_ENABLED -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Installer Authenticode signature is not valid: $($signature.Status)." }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ASCII
      - name: Publish MyFinHub desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem release\desktop\MyFinHub-Setup-*-x64.exe | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $signingNote = if ($env:MYFINHUB_SIGNING_ENABLED -eq 'true') { 'Authenticode-signed build.' } else { 'Unsigned personal-use build; Windows may show Unknown publisher / SmartScreen.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName "$($installer.FullName).sha256" --verify-tag --title "MyFinHub Desktop $env:GITHUB_REF_NAME" --notes "MyFinHub Windows desktop release. $signingNote Updates are accepted only from this controlled release channel and are SHA-256 verified before installation."

