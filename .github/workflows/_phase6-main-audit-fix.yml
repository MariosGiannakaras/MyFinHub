name: Phase 6 main audit lock refresh

on:
  push:
    branches:
      - fix/phase6-main-updater-bridge

permissions:
  contents: write

jobs:
  audit-lock-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/phase6-main-updater-bridge
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install current desktop lock
        run: npm ci --prefix desktop
      - name: Refresh only audited transitive lock entries
        run: npm audit fix --package-lock-only --ignore-scripts --prefix desktop
      - name: Enforce narrow diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "desktop/package-lock.json"
      - name: Verify high audit is clear
        run: npm audit --prefix desktop --audit-level=high
      - name: Remove helper and commit audited lock
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_phase6-main-audit-fix.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/_phase6-main-audit-fix.yml' 'desktop/package-lock.json' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "security: refresh vulnerable desktop transitive lock entries"
          git push origin HEAD:fix/phase6-main-updater-bridge