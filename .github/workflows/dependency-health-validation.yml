name: Dependency Health Validation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chore/505-node24-dependency-health'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            desktop/package-lock.json
      - name: Install exact locked dependencies without package scripts
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm ci --prefix api --ignore-scripts --prefer-offline --no-audit --no-fund
          npm ci --prefix desktop --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Execute reporter without treating available updates as validation failure
        shell: bash
        run: |
          set +e
          node scripts/dependency-health.mjs
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then
            echo "Unexpected reporter exit code: $code"
            exit 1
          fi
          test -s .dependency-health/report.json
          test -s .dependency-health/report.md
          errors="$(jq '.errors | length' .dependency-health/report.json)"
          if [ "$errors" -ne 0 ]; then
            cat .dependency-health/report.md
            exit 1
          fi
          cat .dependency-health/report.md >> "$GITHUB_STEP_SUMMARY"
