name: Patch 202 v1.2.1 regressions once

on:
  push:
    branches:
      - fix/202-windows-first-run-diagnostics

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/202-windows-first-run-diagnostics
          fetch-depth: 0

      - name: Preserve v1.2.1 startup protections
        shell: python
        run: |
          from pathlib import Path

          path = Path('desktop/main.cjs')
          text = path.read_text(encoding='utf-8')

          validation_anchor = "  if (!publishable || publishable.length > 4096 || /\\s/.test(publishable)) throw new Error('Invalid Supabase publishable key.');\n"
          validation_insert = validation_anchor + "  if (/^sb_secret_/i.test(publishable)) throw new Error('Use the Supabase publishable/anon key, never a secret/service-role key.');\n  if (/^eyJ/.test(publishable)) {\n    try {\n      const payload = JSON.parse(Buffer.from(publishable.split('.')[1] || '', 'base64url').toString('utf8'));\n      if (payload?.role === 'service_role') throw new Error('Use the Supabase publishable/anon key, never a service-role key.');\n    } catch (error) {\n      if (error instanceof Error && /service-role/.test(error.message)) throw error;\n    }\n  }\n"
          if validation_anchor not in text:
              raise SystemExit('normalizePublicConfig validation anchor not found')
          if 'never a secret/service-role key' not in text:
              text = text.replace(validation_anchor, validation_insert, 1)

          old_window = """function createWindow(origin, runtime) {
  Menu.setApplicationMenu(null);
  mainWindow = new BrowserWindow({
    title: PRODUCT_NAME, width: 1440, height: 930, minWidth: 960, minHeight: 650, show: false,
    backgroundColor: '#0f1720', icon: runtime.icon, autoHideMenuBar: true,
    webPreferences: {
      preload: path.join(__dirname, 'preload.cjs'), contextIsolation: true, nodeIntegration: false, sandbox: true,
      webSecurity: true, allowRunningInsecureContent: false, devTools: !app.isPackaged,
    },
  });
  hardenWindow(mainWindow, origin);
  mainWindow.once('ready-to-show', () => mainWindow?.show());
  mainWindow.webContents.once('did-finish-load', scheduleAutomaticUpdateChecks);
  mainWindow.on('closed', () => { mainWindow = null; });
  void mainWindow.loadURL(origin);
}
"""
          new_window = """async function createWindow(origin, runtime) {
  Menu.setApplicationMenu(null);
  const window = new BrowserWindow({
    title: PRODUCT_NAME, width: 1440, height: 930, minWidth: 960, minHeight: 650, show: false,
    backgroundColor: '#0f1720', icon: runtime.icon, autoHideMenuBar: true,
    webPreferences: {
      preload: path.join(__dirname, 'preload.cjs'), contextIsolation: true, nodeIntegration: false, sandbox: true,
      webSecurity: true, allowRunningInsecureContent: false, devTools: !app.isPackaged,
    },
  });
  mainWindow = window;
  hardenWindow(window, origin);
  window.on('closed', () => { if (mainWindow === window) mainWindow = null; });
  try {
    await window.loadURL(origin);
    if (!window.isDestroyed()) window.show();
    scheduleAutomaticUpdateChecks();
  } catch (error) {
    if (!window.isDestroyed()) window.destroy();
    if (mainWindow === window) mainWindow = null;
    throw startupError(
      'WINDOW_LOAD_FAILED',
      'window',
      'Το desktop παράθυρο δεν μπόρεσε να φορτώσει την τοπική εφαρμογή.',
      error instanceof Error ? error.message : String(error),
    );
  }
}
"""
          if old_window not in text:
              raise SystemExit('createWindow source block not found')
          text = text.replace(old_window, new_window, 1)

          call = '    createWindow(origin, runtime);'
          count = text.count(call)
          if count != 2:
              raise SystemExit(f'expected 2 createWindow call sites, found {count}')
          text = text.replace(call, '    await createWindow(origin, runtime);')

          path.write_text(text, encoding='utf-8')

      - name: Syntax check patched host
        run: node --check desktop/main.cjs

      - name: Commit patched host
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/main.cjs
          git diff --cached --check
          git commit -m "fix(desktop): preserve v1.2.1 startup regressions"
          git push origin HEAD:fix/202-windows-first-run-diagnostics
