name: Temporary UX Modal Copy Apply

on:
  push:
    branches:
      - feat/ui-ux-hardening-batch
    paths:
      - scripts/.tmp-ux-modal-copy-apply.mjs
      - .github/workflows/.tmp-ux-modal-copy-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ui-ux-hardening-batch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/.tmp-ux-modal-copy-apply.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit modal and message hardening
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/CardsPage.tsx src/pages/LendingPage.tsx src/pages/RecurringPage.tsx src/components/QuickAdd.tsx src/pages/SavingsPage.tsx src/pages/CreditCardPage.tsx src/pages/LoansPage.tsx src/pages/SettingsPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "feat: standardize dialogs and user-facing errors"
            git push origin HEAD:feat/ui-ux-hardening-batch
          fi
