name: Dependency Audit Lock Remediation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'chore/505-node24-dependency-health'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            desktop/package-lock.json
      - name: Apply lockfile-only compatible audit fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit fix --prefix api --package-lock-only --ignore-scripts --no-fund
          npm audit fix --prefix desktop --package-lock-only --ignore-scripts --no-fund || true
      - name: Verify high/critical audit gate
        run: |
          npm audit --package-lock-only --audit-level=high
          npm audit --prefix api --package-lock-only --audit-level=high
          npm audit --prefix desktop --package-lock-only --audit-level=high
      - name: Commit remediated lockfiles when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json api/package-lock.json desktop/package-lock.json; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json api/package-lock.json desktop/package-lock.json
          git commit -m "chore(deps): remediate npm audit findings"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
