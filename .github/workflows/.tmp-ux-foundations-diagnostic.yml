name: Temporary UI UX Foundations Diagnostic

on:
  push:
    branches: [feat/ui-ux-hardening-batch]
    paths: [.github/workflows/.tmp-ux-foundations-diagnostic.yml]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report recent branch runs
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=feat%2Fui-ux-hardening-batch&per_page=30" \
            --jq '[.workflow_runs[] | {id,name,path,event,status,conclusion,head_sha,html_url,created_at}]' > /tmp/runs.json
          {
            echo '### UI/UX branch Actions diagnostic'
            echo
            echo '```json'
            cat /tmp/runs.json
            echo '```'
          } > /tmp/report.md
          gh issue comment 158 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
