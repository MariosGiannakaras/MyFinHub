          p=Path('src/hooks/useModalFocus.ts')
          p.write_text("""import { useEffect, useRef, type RefObject } from 'react';

const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\"-1\"])';

export function useModalFocus<T extends HTMLElement>(open: boolean, preferred?: string, onClose?: () => void): RefObject<T | null> {
  const ref = useRef<T | null>(null);
  const opener = useRef<HTMLElement | null>(null);
  const onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;

  useEffect(() => {
    if (!open) return;
    opener.current = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    const root = ref.current;
    if (!root) return;

    const body = document.body;
    const html = document.documentElement;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const bodyStyle = { position: body.style.position, top: body.style.top, left: body.style.left, right: body.style.right, width: body.style.width, overflow: body.style.overflow };
    const htmlOverscroll = html.style.overscrollBehavior;
    body.style.position = 'fixed';
    body.style.top = `-${scrollY}px`;
    body.style.left = `-${scrollX}px`;
    body.style.right = '0';
    body.style.width = '100%';
    body.style.overflow = 'hidden';
    html.style.overscrollBehavior = 'none';

    const initial = (preferred ? root.querySelector<HTMLElement>(preferred) : null) ?? root.querySelector<HTMLElement>(FOCUSABLE) ?? root;
    queueMicrotask(() => initial.focus({ preventScroll: true }));

    const trap = (event: KeyboardEvent) => {
      if (event.key === 'Escape' && onCloseRef.current) {
        event.preventDefault();
        event.stopPropagation();
        onCloseRef.current();
        return;
      }
      if (event.key !== 'Tab') return;
      const items = [...root.querySelectorAll<HTMLElement>(FOCUSABLE)].filter((item) => item.offsetParent !== null);
      if (!items.length) { event.preventDefault(); root.focus({ preventScroll: true }); return; }
      const first = items[0];
      const last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus({ preventScroll: true }); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus({ preventScroll: true }); }
    };
    document.addEventListener('keydown', trap);
    return () => {
      document.removeEventListener('keydown', trap);
      body.style.position = bodyStyle.position;
      body.style.top = bodyStyle.top;
      body.style.left = bodyStyle.left;
      body.style.right = bodyStyle.right;
      body.style.width = bodyStyle.width;
      body.style.overflow = bodyStyle.overflow;
      html.style.overscrollBehavior = htmlOverscroll;
      window.scrollTo({ left: scrollX, top: scrollY, behavior: 'auto' });
      queueMicrotask(() => opener.current?.focus({ preventScroll: true }));
    };
  }, [open, preferred]);

  return ref;
}
""")

          Path('src/components/Tooltip.tsx').write_text("""import { cloneElement, isValidElement, useId, type ReactElement, type ReactNode } from 'react';

type TooltipSide = 'top' | 'right' | 'bottom' | 'left';
type DescribedElement = ReactElement<{ 'aria-describedby'?: string }>;

export function Tooltip({label,children,side='bottom'}:{label:string;children:ReactNode;side?:TooltipSide}) {
  const id=useId();
  const child=isValidElement(children)?(() => {
    const element=children as DescribedElement;
    const describedBy=[element.props['aria-describedby'],id].filter(Boolean).join(' ');
    return cloneElement(element,{'aria-describedby':describedBy});
  })():children;
  return <span className={`app-tooltip app-tooltip-${side}`}>
    {child}
    <span className="app-tooltip-bubble" id={id} role="tooltip">{label}</span>
  </span>;
}
""")

