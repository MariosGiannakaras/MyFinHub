name: Temporary v1.0.2 Release Prep

on:
  push:
    branches:
      - release/v1.0.2-prep
    paths:
      - .github/workflows/.tmp-v102-release-prep.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2-prep
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Update package and lock versions
        run: |
          npm version 1.0.2 --no-git-tag-version
          npm --prefix desktop version 1.0.2 --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json desktop/package.json desktop/package-lock.json
          git commit -m "chore: bump release version to 1.0.2"
          git push origin HEAD:release/v1.0.2-prep
