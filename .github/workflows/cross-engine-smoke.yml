name: Cross-engine smoke

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cross-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit-smoke:
    name: WebKit compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned WebKit driver
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps webkit
      - name: Run WebKit compatibility smoke
        run: |
          npm run dev:web > /tmp/myfinhub-webkit-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/qa.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/myfinhub-webkit-vite.log
            exit 1
          fi
          node scripts/webkit-smoke.mjs
      - name: Upload WebKit smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myfinhub-webkit-${{ github.sha }}
          path: /tmp/myfinhub-webkit-smoke/*.png
          if-no-files-found: warn
          retention-days: 14
