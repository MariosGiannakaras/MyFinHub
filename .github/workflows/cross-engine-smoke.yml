name: Cross-engine smoke

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cross-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit-smoke:
    name: WebKit compatibility smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned WebKit driver
        run: |
          TOOL_ROOT=/tmp/myfinhub-playwright-tool
          rm -rf "$TOOL_ROOT"
          mkdir -p "$TOOL_ROOT"
          npm install --prefix "$TOOL_ROOT" --package-lock=false playwright@1.62.1
          ln -s "$TOOL_ROOT/node_modules/playwright" node_modules/playwright
          ln -s "$TOOL_ROOT/node_modules/playwright-core" node_modules/playwright-core
          "$TOOL_ROOT/node_modules/.bin/playwright" install --with-deps webkit
      - name: Run WebKit compatibility smoke
        run: |
          npm run dev:web > /tmp/myfinhub-webkit-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/qa.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/myfinhub-webkit-vite.log
            exit 1
          fi
          node scripts/webkit-smoke.mjs
      - name: Upload WebKit smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myfinhub-webkit-${{ github.sha }}
          path: /tmp/myfinhub-webkit-smoke/*.png
          if-no-files-found: warn
          retention-days: 14
