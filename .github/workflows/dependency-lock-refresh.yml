name: Dependency Lock Refresh

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'chore/505-node24-dependency-health'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            desktop/package-lock.json
      - name: Regenerate package locks only
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix api --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix desktop --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node24-lockfiles
          path: |
            package-lock.json
            api/package-lock.json
            desktop/package-lock.json
          if-no-files-found: error
          retention-days: 1
