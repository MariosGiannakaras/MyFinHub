name: Fetch Official Bank Brand Assets

on:
  push:
    branches:
      - feat/346-settings-tabs
    paths:
      - .github/workflows/fetch-official-bank-brand-assets.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect official Piraeus press-kit logo candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/official-bank-brand-assets
          mkdir -p "$ROOT/piraeus"
          curl -fL --retry 2 --connect-timeout 20 -A 'Mozilla/5.0' \
            'https://www.piraeusgroup.gr/grafeio-typoy/press-kit' \
            -o "$ROOT/piraeus/press-kit.html"
          grep -Eoi 'https?[^"<> ]+\.(zip|rar|svg|png)(\?[^"<> ]*)?' "$ROOT/piraeus/press-kit.html" | sort -u > "$ROOT/piraeus/candidate-urls.txt" || true
          grep -Eoi '(href|src)="[^"]*(logo|logos|logotyp)[^"]*"' "$ROOT/piraeus/press-kit.html" | sort -u >> "$ROOT/piraeus/candidate-urls.txt" || true
          sort -u -o "$ROOT/piraeus/candidate-urls.txt" "$ROOT/piraeus/candidate-urls.txt"
          echo '--- official Piraeus press-kit candidates ---'
          cat "$ROOT/piraeus/candidate-urls.txt"

      - name: Upload small research artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-piraeus-logo-candidates-${{ github.sha }}
          path: /tmp/official-bank-brand-assets/piraeus
          if-no-files-found: error
          retention-days: 1
