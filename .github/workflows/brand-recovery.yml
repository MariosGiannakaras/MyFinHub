name: One-shot authentic brand recovery

on:
  push:
    branches: [fix/readme-authentic-branding]
    paths:
      - tmp/authentic-rheomiq-icon.png
      - .github/workflows/brand-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/readme-authentic-branding
      - name: Generate native authentic artwork sizes
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          root = Path('.')
          source = root / 'tmp/authentic-rheomiq-icon.png'
          image = Image.open(source).convert('RGBA')
          if image.size != (192, 192):
              raise SystemExit(f'Unexpected authentic source size: {image.size}')

          outputs = {
              32: [root / 'public/favicon.png', root / 'assets/branding/myfinhub/icon-32.png'],
              192: [root / 'public/brand/icon-192.png', root / 'desktop/setup-brand.png', root / 'assets/branding/myfinhub/icon-192.png'],
              512: [root / 'public/brand/icon-512.png', root / 'assets/branding/myfinhub/icon-512.png'],
          }
          for size, paths in outputs.items():
              for path in paths:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  if size == 192:
                      shutil.copyfile(source, path)
                  else:
                      image.resize((size, size), Image.Resampling.LANCZOS).save(path, 'PNG', optimize=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/favicon.png public/brand/icon-192.png public/brand/icon-512.png desktop/setup-brand.png assets/branding/myfinhub/icon-32.png assets/branding/myfinhub/icon-192.png assets/branding/myfinhub/icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore authentic application artwork"
          git push origin HEAD:fix/readme-authentic-branding
