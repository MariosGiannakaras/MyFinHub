name: One-shot v1.0.1 metadata prep

on:
  push:
    branches: [release/v1.0.1-prep]
    paths:
      - .github/workflows/v1.0.1-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.0.1-prep
      - name: Bump release metadata without re-resolving dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const paths = ['package.json', 'package-lock.json', 'desktop/package.json', 'desktop/package-lock.json'];
          for (const path of paths) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = '1.0.1';
            if (value.packages?.['']) value.packages[''].version = '1.0.1';
            if (path === 'desktop/package-lock.json' && value.packages?.['..']) value.packages['..'].version = '1.0.1';
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json desktop/package.json desktop/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "release: bump MyFinHub desktop to 1.0.1"
          git push origin HEAD:release/v1.0.1-prep
