name: Issue 298 non-visual validation

on:
  push:
    branches: [issue-298-dashboard-redesign]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Focused Dashboard source tests
        run: npx vitest run tests/shell-dashboard-hierarchy-source.test.ts tests/selectors.test.ts
      - run: npm run security:guard
      - run: npm test
      - run: npm run build
