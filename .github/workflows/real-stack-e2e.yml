name: Real Stack E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/real-stack-e2e.yml'
      - 'scripts/real-stack-e2e.ts'
      - 'scripts/real-stack-fixture.ts'
      - 'scripts/migration-recovery-e2e.ts'
      - 'scripts/recovery-fixtures/**'
      - 'tests/real-stack-e2e-source.test.ts'
      - 'tests/migration-recovery-source.test.ts'
      - 'tests/real-stack-fixture.test.ts'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: real-stack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-local-supabase:
    name: isolated-local-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify pinned Supabase CLI
        run: npx --yes supabase@2.119.0 --version
      - name: Start isolated local Supabase
        run: npx --yes supabase@2.119.0 start
      - name: Run MyFinHub real-stack proof
        run: npm run qa:real-stack
      - name: Rehearse forward-only migration recovery
        run: npm run qa:migration-recovery
      - name: Stop and discard local Supabase data
        if: always()
        run: npx --yes supabase@2.119.0 stop --no-backup
