name: Phase 6 narrow audited lock patch

on:
  push:
    branches:
      - fix/phase6-main-updater-bridge

permissions:
  contents: write

jobs:
  narrow-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/phase6-main-updater-bridge
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore main lock and patch only audited transitive packages
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:desktop/package-lock.json > desktop/package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'desktop/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const xmldom = lock.packages['node_modules/@xmldom/xmldom'];
          const fastUri = lock.packages['node_modules/fast-uri'];
          if (!xmldom || xmldom.version !== '0.8.14') throw new Error('unexpected xmldom base');
          if (!fastUri || fastUri.version !== '3.1.5') throw new Error('unexpected fast-uri base');
          Object.assign(xmldom, {
            version: '0.8.15',
            resolved: 'https://registry.npmjs.org/@xmldom/xmldom/-/xmldom-0.8.15.tgz',
            integrity: 'sha512-/5NV/vDALVFDXgLmfsy9TRCBlKwO2LNBFzpzvb9iIj+jR+eSc6DLYYvVOdivT/jm7MtU6TebYuRmzEOI7w40UA=='
          });
          Object.assign(fastUri, {
            version: '3.1.7',
            resolved: 'https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.7.tgz',
            integrity: 'sha512-dOvZVzjdZdz7phd9v6jCbwxrBW3fK6n8Rc0CtdmM4bumzMnxywBYhuph6J819RRw/ku+rLbelwfMunktuzVVHg=='
          });
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          test "$(git diff --name-only)" = "desktop/package-lock.json"
      - name: Verify install and security audit
        run: |
          npm ci --prefix desktop
          npm audit --prefix desktop --audit-level=high
      - name: Commit narrow lock patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "security: patch vulnerable desktop transitive packages"
          git push origin HEAD:fix/phase6-main-updater-bridge