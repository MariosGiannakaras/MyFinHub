name: Temporary UX Browser QA Apply

on:
  push:
    branches:
      - feat/ui-ux-hardening-batch
    paths:
      - scripts/.tmp-ux-browser-qa-apply.mjs
      - .github/workflows/.tmp-ux-browser-qa-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ui-ux-hardening-batch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/.tmp-ux-browser-qa-apply.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit browser QA hardening
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/AppDateInput.tsx src/components/AppSelectInput.tsx src/components/AppShell.tsx src/pages/TransactionsPage.tsx src/pages/LoansPage.tsx src/pages/CreditCardPage.tsx src/styles/part30.css scripts/frontend-redesign-qa.mjs .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "test: add rendered browser visual and interaction evidence"
            git push origin HEAD:feat/ui-ux-hardening-batch
          fi
