name: Code health lock refresh

on:
  push:
    branches:
      - chore/357-code-health-foundation
    paths:
      - .github/workflows/code-health-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-desktop-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/357-code-health-foundation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Refresh patched js-yaml resolution
        run: npm install js-yaml@4.3.2 --package-lock-only --no-save --prefix desktop
      - name: Verify desktop high-severity audit
        run: npm audit --audit-level=high --prefix desktop
      - name: Commit lock-only refresh
        shell: bash
        run: |
          test -z "$(git status --porcelain -- desktop/package.json)"
          git diff --check
          if git diff --quiet -- desktop/package-lock.json; then
            echo "Expected desktop/package-lock.json to change" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "chore(desktop): refresh patched js-yaml lock"
          git push origin HEAD:chore/357-code-health-foundation
