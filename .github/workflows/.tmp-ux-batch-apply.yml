name: Temporary UX Batch Apply

on:
  push:
    branches:
      - feat/ui-ux-hardening-batch
    paths:
      - scripts/.tmp-ux-batch-apply.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ui-ux-hardening-batch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/.tmp-ux-batch-apply.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit coordinated batch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/validation.ts src/qaFixture.ts src/pages/LoansPage.tsx src/pages/CreditCardPage.tsx src/pages/SavingsPage.tsx src/styles/part30.css
          if ! git diff --cached --quiet; then
            git commit -m "feat: complete shared sorting modal and copy foundations"
            git push origin HEAD:feat/ui-ux-hardening-batch
          fi
