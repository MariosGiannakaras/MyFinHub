name: Production Smoke

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: production-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production' &&
       github.event.deployment_status.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://mgfinhub.vercel.app

    steps:
      - name: Verify deployed release SHA
        if: github.event_name == 'deployment_status'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail

          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Deployment event did not provide a canonical commit SHA: $DEPLOYED_SHA"
            exit 1
          }

          expected_sha="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | python -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])"
          )"

          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GitHub main ref did not resolve to a canonical commit SHA: $expected_sha"
            exit 1
          }
          [[ "$DEPLOYED_SHA" == "$expected_sha" ]] || {
            echo "Production deployment SHA $DEPLOYED_SHA does not match main release head $expected_sha"
            exit 1
          }

          echo "Production deployment SHA matches main release head: $DEPLOYED_SHA"

      - name: Verify public production surface
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_path() {
            local path="$1"
            local name="$2"
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 20 \
              --dump-header "$tmp/${name}.headers" \
              --output "$tmp/${name}.body" \
              --write-out '%{http_code}' \
              "$BASE_URL$path"
          }

          header_value() {
            local file="$1"
            local key="$2"
            grep -i "^${key}:" "$file" 2>/dev/null \
              | tail -n 1 \
              | cut -d ':' -f 2- \
              | sed 's/^[[:space:]]*//;s/\r$//' \
              || true
          }

          require_header() {
            local file="$1"
            local key="$2"
            local value
            value="$(header_value "$file" "$key")"
            if [[ -z "$value" ]]; then
              echo "Missing required header: $key"
              exit 1
            fi
          }

          root_status="$(fetch_path '/' root)"
          [[ "$root_status" == '200' ]] || {
            echo "Expected / to return 200, got $root_status"
            exit 1
          }

          health_status="$(fetch_path '/api/health' health)"
          [[ "$health_status" == '200' ]] || {
            echo "Expected /api/health to return 200, got $health_status"
            exit 1
          }

          python - "$tmp/health.body" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as fh:
              payload = json.load(fh)

          assert payload == {'ok': True, 'app': 'MyFinHub'}, payload
          PY

          data_status="$(fetch_path '/api/data' data)"
          [[ "$data_status" == '401' ]] || {
            echo "Expected unauthenticated /api/data to return 401, got $data_status"
            exit 1
          }

          unknown_status="$(fetch_path '/__myfinhub-unknown-route-probe' unknown)"
          [[ "$unknown_status" == '404' ]] || {
            echo "Expected unknown web path to return 404, got $unknown_status"
            exit 1
          }
          unknown_type="$(header_value "$tmp/unknown.headers" 'content-type')"
          [[ "$unknown_type" == *'text/html'* ]] || {
            echo "Expected branded MyFinHub HTML 404; content-type was: $unknown_type"
            exit 1
          }
          grep -Fq '404 · MYFINHUB' "$tmp/unknown.body" || {
            echo "Expected branded MyFinHub HTML 404 marker"
            exit 1
          }
          grep -Fq 'Χάσαμε τη διαδρομή, όχι τα δεδομένα σου.' "$tmp/unknown.body" || {
            echo "Expected privacy-safe MyFinHub 404 copy"
            exit 1
          }

          for header in \
            Content-Security-Policy \
            Strict-Transport-Security \
            X-Content-Type-Options \
            X-Frame-Options \
            Referrer-Policy \
            Permissions-Policy \
            Cross-Origin-Opener-Policy \
            Cross-Origin-Resource-Policy
          do
            require_header "$tmp/root.headers" "$header"
          done

          health_cache="$(header_value "$tmp/health.headers" 'Cache-Control')"
          [[ "$health_cache" == *'no-store'* ]] || {
            echo "Expected /api/health Cache-Control to contain no-store; got: $health_cache"
            exit 1
          }

          data_cache="$(header_value "$tmp/data.headers" 'Cache-Control')"
          [[ "$data_cache" == *'no-store'* ]] || {
            echo "Expected /api/data Cache-Control to contain no-store; got: $data_cache"
            exit 1
          }

          vercel_id="$(header_value "$tmp/health.headers" 'x-vercel-id')"
          [[ "$vercel_id" == *'fra1'* ]] || {
            echo "Expected /api/health x-vercel-id to include fra1; got: $vercel_id"
            exit 1
          }

          echo "Production smoke checks passed."
