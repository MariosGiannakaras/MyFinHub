name: Release 206 Version Helper

on:
  push:
    branches: [release/206-v1.2.1]
    paths:
      - .github/workflows/release-206-version-helper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/206-v1.2.1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Set exact patch version and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.2.1 --no-git-tag-version --allow-same-version
          npm version 1.2.1 --prefix desktop --no-git-tag-version --allow-same-version
          test "$(node -p "require('./package.json').version")" = "1.2.1"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.1"
          test "$(node -p "require('./desktop/package.json').version")" = "1.2.1"
          test "$(node -p "require('./desktop/package-lock.json').version")" = "1.2.1"
          git rm .github/workflows/release-206-version-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json desktop/package.json desktop/package-lock.json
          git commit -m "chore: bump MyFinHub to v1.2.1"
          git push origin HEAD:release/206-v1.2.1
