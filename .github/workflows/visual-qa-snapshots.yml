name: Visual QA Snapshots

on:
  push:
    branches-ignore:
      - main
      - develop
    paths-ignore:
      - 'visual-qa/**'
  workflow_dispatch:

concurrency:
  group: visual-qa-snapshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ false }}
    name: temporarily-disabled-for-owner-no-image-contract
    runs-on: ubuntu-latest
    steps:
      - run: echo "Visual QA intentionally disabled for this branch task because the owner explicitly prohibited image creation."
