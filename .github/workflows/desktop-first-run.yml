name: Windows First Run

on:
  pull_request:
    branches: [main, develop]
    paths:
      - desktop/**
      - server/**
      - tests/desktop-*.test.ts
      - package.json
      - package-lock.json
      - .github/workflows/desktop-first-run.yml
      - .github/workflows/desktop-clean-launch.yml
  push:
    branches: [develop]
    paths:
      - desktop/**
      - server/**
      - tests/desktop-*.test.ts
      - package.json
      - package-lock.json
      - .github/workflows/desktop-first-run.yml
      - .github/workflows/desktop-clean-launch.yml
  workflow_dispatch:

concurrency:
  group: desktop-first-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-owned-first-run:
    name: application-owned-first-run-contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop
      - name: Validate application-owned first-run contract
        shell: pwsh
        run: |
          npm run check
          npm run desktop:check
          npx vitest run tests/desktop-first-run-source.test.ts tests/desktop-startup-diagnostics.test.ts tests/desktop-card-vault-proxy.test.ts
      - name: Verify release entrypoint and no legacy provisioning contract
        shell: pwsh
        run: |
          $desktopPackage = Get-Content -LiteralPath 'desktop\package.json' -Raw | ConvertFrom-Json
          if ([string]$desktopPackage.main -ne 'bootstrap.cjs') { throw 'Desktop release entrypoint must be bootstrap.cjs.' }

          $defaults = Get-Content -LiteralPath 'desktop\runtime-defaults.cjs' -Raw
          if ($defaults -match '__MYFINHUB_SUPABASE_') { throw 'Desktop release defaults still contain unresolved placeholders.' }
          if ($defaults -notmatch "supabaseUrl:\s*'https://[^']+'") { throw 'Controlled HTTPS Supabase URL is missing from desktop release defaults.' }
          if ($defaults -notmatch "supabasePublishableKey:\s*'sb_publishable_[^']+'") { throw 'Controlled Supabase publishable key is missing from desktop release defaults.' }

          $bootstrap = Get-Content -LiteralPath 'desktop\bootstrap.cjs' -Raw
          if ($bootstrap -notmatch 'delete process\.env\.CARD_VAULT_KEY') { throw 'Desktop bootstrap must remove CARD_VAULT_KEY from the release process.' }
          if ($bootstrap -notmatch 'pending-provision\.json') { throw 'Desktop bootstrap must clean legacy pending provisioning state.' }

          Write-Host 'Application-owned first-run contract passed. Real NSIS clean-launch lifecycle is covered by Windows Clean Launch.'
