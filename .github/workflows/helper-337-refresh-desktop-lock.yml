name: Helper 337 refresh desktop lock

on:
  push:
    branches:
      - automation/337-refresh-desktop-lock
    paths:
      - .github/workflows/helper-337-refresh-desktop-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/337-attention-approved-target
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Refresh vulnerable transitive desktop lock entries
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --prefix desktop --package-lock-only --ignore-scripts
          npm audit --prefix desktop --audit-level=high
          git diff --exit-code -- desktop/package.json
          if git diff --quiet -- desktop/package-lock.json; then
            echo "Expected desktop/package-lock.json to change." >&2
            exit 1
          fi
      - name: Commit lockfile to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "fix(security): refresh desktop transitive lock"
          git push origin HEAD:feat/337-attention-approved-target
