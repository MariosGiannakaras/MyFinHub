name: Historical Defect Mining

on:
  workflow_dispatch:
    inputs:
      since:
        description: UTC start date (YYYY-MM-DD), empty for previous 7 days
        required: false
        type: string
      until:
        description: UTC end date (YYYY-MM-DD), empty for today
        required: false
        type: string
  schedule:
    - cron: '15 4 * * 1'

concurrency:
  group: historical-defect-mining
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Collect read-only failed-run and tracker metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          SINCE="${INPUT_SINCE:-$(date -u -d '7 days ago' +%F)}"
          UNTIL="${INPUT_UNTIL:-$(date -u +%F)}"
          npm run defects:mine -- --since "$SINCE" --until "$UNTIL" --include-trackers --inspect-jobs 12 --max-requests 160
      - name: Upload bounded metadata report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-defect-candidates
          path: .qa-artifacts/defect-mining/historical-inventory.json
          if-no-files-found: warn
          retention-days: 14
