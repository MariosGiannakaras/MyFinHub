name: Windows Desktop

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-windows-package
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install application dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop
      - name: Validate desktop boundary and dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=high
          npm run desktop:check
      - name: Validate Windows PowerShell fallback bootstrap
        shell: pwsh
        env:
          SUPABASE_URL: https://desktop-smoke.invalid
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_desktop_smoke_only
          CARD_VAULT_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          CARD_VAULT_KEY_VERSION: "1"
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File desktop\install-windows.ps1 -ValidateOnly
      - name: Build production frontend once
        shell: pwsh
        run: npm run build
      - name: Build unpacked Windows desktop app
        shell: pwsh
        run: npm run desktop:pack:from-dist
      - name: Smoke packaged executable and hidden local backend
        shell: pwsh
        env:
          SUPABASE_URL: https://desktop-smoke.invalid
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_desktop_smoke_only
        run: |
          $exe = Join-Path $PWD 'release\desktop\win-unpacked\MyFinHub.exe'
          if (-not (Test-Path $exe)) { throw 'Packaged MyFinHub.exe is missing.' }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Packaged MyFinHub exited during smoke with code $($process.ExitCode)." }
          $backend = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -ieq 'node.exe' -and $_.CommandLine -match 'server\.mjs' -and $_.CommandLine -match '--serve-dist'
          } | Select-Object -First 1
          if (-not $backend) { throw 'Packaged MyFinHub local backend server.mjs --serve-dist process is not running.' }

          taskkill /PID $process.Id /T /F | Out-Null
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'node.exe' -and $_.CommandLine -match 'server\.mjs' -and $_.CommandLine -match '--serve-dist' } | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }

          $probePath = Join-Path $PWD 'release\desktop\titlebar-window-state.json'
          Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
          $env:MYFINHUB_WINDOW_STATE_PROBE_PATH = $probePath
          try {
            $probeProcess = Start-Process -FilePath $exe -PassThru
            for ($attempt = 0; $attempt -lt 80 -and -not (Test-Path -LiteralPath $probePath); $attempt++) {
              Start-Sleep -Milliseconds 250
              $probeProcess.Refresh()
              if ($probeProcess.HasExited -and -not (Test-Path -LiteralPath $probePath)) { break }
            }
          } finally {
            Remove-Item Env:MYFINHUB_WINDOW_STATE_PROBE_PATH -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath $probePath)) { throw 'Packaged Electron BrowserWindow state probe did not produce evidence.' }
          $probe = Get-Content -LiteralPath $probePath -Raw | ConvertFrom-Json
          if (-not $probe.passed -or -not $probe.maximized -or -not $probe.restored) {
            throw "Packaged Electron BrowserWindow state probe failed: $($probe | ConvertTo-Json -Compress)"
          }
          if ($probe.size[0] -ne 1100 -or $probe.size[1] -ne 760) {
            throw "Packaged Electron resize probe returned unexpected size: $($probe.size -join 'x')."
          }
          Write-Host "Electron BrowserWindow title-bar states validated: maximize=$($probe.maximized), restore=$($probe.restored), resize=$($probe.size -join 'x')."
          if (-not $probeProcess.HasExited) {
            Wait-Process -Id $probeProcess.Id -Timeout 10 -ErrorAction SilentlyContinue
            $probeProcess.Refresh()
          }
          if (-not $probeProcess.HasExited) { taskkill /PID $probeProcess.Id /T /F | Out-Null }
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'node.exe' -and $_.CommandLine -match 'server\.mjs' -and $_.CommandLine -match '--serve-dist' } | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
      - name: Build interactive NSIS Setup
        shell: pwsh
        run: npm run desktop:dist:from-dist
      - name: Install, launch and uninstall NSIS package
        shell: pwsh
        env:
          SUPABASE_URL: https://desktop-smoke.invalid
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_desktop_smoke_only
        run: |
          $installer = Get-ChildItem release\desktop\MyFinHub-Setup-*-x64.exe | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer artifact is missing before install smoke.' }

          Get-Process MyFinHub -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'node.exe' -and $_.CommandLine -match 'server\.mjs' -and $_.CommandLine -match '--serve-dist' } | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent NSIS install failed with exit code $($install.ExitCode)." }
          Start-Sleep -Seconds 3
          Get-Process MyFinHub -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MyFinHub.lnk'
          if (-not (Test-Path -LiteralPath $desktopShortcut)) { throw 'Installed MyFinHub Desktop shortcut is missing.' }

          $startMenuRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $startMenuShortcut = Get-ChildItem -LiteralPath $startMenuRoot -Filter 'MyFinHub.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $startMenuShortcut) { throw 'Installed MyFinHub Start Menu shortcut is missing.' }

          $shell = New-Object -ComObject WScript.Shell
          $desktopLink = $shell.CreateShortcut($desktopShortcut)
          $exe = $desktopLink.TargetPath
          if ([string]::IsNullOrWhiteSpace($exe) -or -not (Test-Path -LiteralPath $exe)) { throw 'Desktop shortcut does not resolve to an installed executable.' }
          if ([IO.Path]::GetFileName($exe) -ne 'MyFinHub.exe') { throw "Desktop shortcut points to unexpected executable: $exe" }

          $version = (Get-Item -LiteralPath $exe).VersionInfo
          $identity = "$($version.ProductName) $($version.FileDescription)"
          if ($identity -notmatch 'MyFinHub') { throw "Installed executable metadata does not identify MyFinHub: $identity" }

          Add-Type -AssemblyName System.Drawing
          $associatedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $associatedIcon -or $associatedIcon.Width -lt 16 -or $associatedIcon.Height -lt 16) { throw 'Installed MyFinHub executable has no usable associated icon.' }
          $associatedIcon.Dispose()

          $uninstallRoots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $uninstallEntry = $uninstallRoots |
            ForEach-Object { Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue } |
            Where-Object { $_.DisplayName -like 'MyFinHub*' } |
            Select-Object -First 1
          if (-not $uninstallEntry) { throw 'MyFinHub uninstall registration is missing from the Windows uninstall registry views.' }
          if ([string]::IsNullOrWhiteSpace($uninstallEntry.UninstallString)) { throw 'MyFinHub uninstall registration has no uninstall command.' }

          $launcher = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $launcher.Refresh()
          if ($launcher.HasExited) { throw "Installed MyFinHub exited during launch smoke with code $($launcher.ExitCode)." }
          $installedProcess = Get-Process MyFinHub -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } | Select-Object -First 1
          if (-not $installedProcess) { throw 'Installed MyFinHub process is not running from the installed executable path.' }
          $installedBackend = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -ieq 'node.exe' -and $_.CommandLine -match 'server\.mjs' -and $_.CommandLine -match '--serve-dist'
          } | Select-Object -First 1
          if (-not $installedBackend) { throw 'Installed MyFinHub local backend server.mjs --serve-dist process is not running.' }
          Get-Process MyFinHub -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'node.exe' -and $_.CommandLine -match 'server\.mjs' -and $_.CommandLine -match '--serve-dist' } | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }

          $installDir = Split-Path -Parent $exe
          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'Installed MyFinHub uninstaller is missing.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent NSIS uninstall failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 3

          if (Test-Path -LiteralPath $exe) { throw 'MyFinHub executable remains after silent uninstall.' }
          if (Test-Path -LiteralPath $desktopShortcut) { throw 'MyFinHub Desktop shortcut remains after silent uninstall.' }
          $remainingStartMenu = Get-ChildItem -LiteralPath $startMenuRoot -Filter 'MyFinHub.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($remainingStartMenu) { throw 'MyFinHub Start Menu shortcut remains after silent uninstall.' }
      - name: Verify installer and update-channel checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\desktop\MyFinHub-Setup-*-x64.exe | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer artifact is missing.' }
          if ($installer.Length -lt 50MB -or $installer.Length -gt 350MB) { throw 'Windows installer artifact size is outside the accepted update range.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ASCII
          $line = (Get-Content -LiteralPath "$($installer.FullName).sha256" -Raw).Trim()
          if ($line -notmatch '^[a-f0-9]{64}\s+MyFinHub-Setup-[0-9]+\.[0-9]+\.[0-9]+-x64\.exe$') { throw 'Update checksum metadata format is invalid.' }
      - name: Upload Windows installer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myfinhub-windows-${{ github.sha }}
          path: |
            release/desktop/MyFinHub-Setup-*-x64.exe
            release/desktop/MyFinHub-Setup-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
