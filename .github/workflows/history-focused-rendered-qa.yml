name: History Focused Rendered QA

on:
  pull_request:
    branches: [develop]
    types: [synchronize, edited]

concurrency:
  group: history-focused-rendered-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  history-browser-evidence:
    name: history-browser-evidence
    if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '<!-- run-history-focused-qa -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Preflight synthetic browser suites
        run: |
          node --check scripts/history-dialog-qa.mjs
          node --check scripts/save-progress-qa.mjs
          node --check scripts/savings-remediation-qa.mjs
          command -v chromium || command -v chromium-browser
      - name: Start synthetic Vite QA site
        run: |
          npm run dev:web > /tmp/myfinhub-history-vite.log 2>&1 &
          echo $! > /tmp/myfinhub-history-vite.pid
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5173/qa.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/myfinhub-history-vite.log; exit 1; fi
      - name: Check History modal with real rendered cursor, focus and responsive interaction
        env:
          RHEOMIQ_QA_URL: http://127.0.0.1:5173/qa.html
        run: |
          mkdir -p "$RUNNER_TEMP/history-focused/screenshots" "$RUNNER_TEMP/history-focused/logs"
          export MYFINHUB_UX_EVIDENCE_DIR="$RUNNER_TEMP/history-focused/screenshots"
          node scripts/history-dialog-qa.mjs 2>&1 | tee "$RUNNER_TEMP/history-focused/logs/history-dialog.log"
          exit "${PIPESTATUS[0]}"
      - name: Check actual hooked persistence bar and delayed server reads
        env:
          RHEOMIQ_QA_URL: http://127.0.0.1:5173/qa.html
        run: |
          export MYFINHUB_UX_EVIDENCE_DIR="$RUNNER_TEMP/history-focused/screenshots"
          node scripts/save-progress-qa.mjs 2>&1 | tee "$RUNNER_TEMP/history-focused/logs/save-progress.log"
          exit "${PIPESTATUS[0]}"
      - name: Check Savings historical/current reporting balances and goal progress
        env:
          RHEOMIQ_QA_URL: http://127.0.0.1:5173/qa.html
        run: |
          export MYFINHUB_UX_EVIDENCE_DIR="$RUNNER_TEMP/history-focused/screenshots"
          node scripts/savings-remediation-qa.mjs 2>&1 | tee "$RUNNER_TEMP/history-focused/logs/savings-remediation.log"
          exit "${PIPESTATUS[0]}"
      - name: Stop server and capture its log
        if: always()
        run: |
          if [ -f /tmp/myfinhub-history-vite.pid ]; then kill "$(cat /tmp/myfinhub-history-vite.pid)" || true; fi
          mkdir -p "$RUNNER_TEMP/history-focused/logs"
          cp /tmp/myfinhub-history-vite.log "$RUNNER_TEMP/history-focused/logs/vite.log" 2>/dev/null || true
      - name: Upload screenshots and browser logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myfinhub-history-focused-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/history-focused/screenshots/*.png
            ${{ runner.temp }}/history-focused/logs/*.log
          if-no-files-found: warn
          retention-days: 14
