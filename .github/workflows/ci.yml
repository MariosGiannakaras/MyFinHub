name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm audit --audit-level=high
      - run: npm audit --prefix api --audit-level=high
      - run: npm run check
      - run: npm run check --prefix api
      - name: Rendered frontend QA
        run: |
          npm run dev:web > /tmp/rheomiq-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/qa.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rheomiq-vite.log
            exit 1
          fi

          # Keep both runner browsers available. Each rendered suite starts with
          # Chromium and the coordinator switches to system Chrome only when the
          # primary browser fails to expose its isolated CDP endpoint.
          PRIMARY_BROWSER="$(command -v chromium || command -v chromium-browser || true)"
          FALLBACK_BROWSER="$(command -v google-chrome || true)"
          if [ -z "$PRIMARY_BROWSER" ]; then
            PRIMARY_BROWSER="$FALLBACK_BROWSER"
            FALLBACK_BROWSER=""
          fi
          if [ -z "$PRIMARY_BROWSER" ]; then
            echo "Chrome/Chromium is required for rendered frontend QA."
            exit 1
          fi
          export MYFINHUB_QA_PRIMARY_BROWSER="$PRIMARY_BROWSER"
          export MYFINHUB_QA_FALLBACK_BROWSER="$FALLBACK_BROWSER"
          mkdir -p /tmp/myfinhub-qa-browser-bin
          cat > /tmp/myfinhub-qa-browser-bin/google-chrome <<'EOF'
          #!/usr/bin/env bash
          browser="${MYFINHUB_QA_PRIMARY_BROWSER}"
          if [ "${MYFINHUB_QA_USE_FALLBACK:-0}" = "1" ] && [ -n "${MYFINHUB_QA_FALLBACK_BROWSER:-}" ]; then
            browser="${MYFINHUB_QA_FALLBACK_BROWSER}"
          fi
          exec "$browser" --disable-dev-shm-usage "$@"
          EOF
          chmod +x /tmp/myfinhub-qa-browser-bin/google-chrome
          export PATH="/tmp/myfinhub-qa-browser-bin:$PATH"
          echo "Rendered QA primary browser: $($PRIMARY_BROWSER --version)"
          if [ -n "$FALLBACK_BROWSER" ] && [ "$FALLBACK_BROWSER" != "$PRIMARY_BROWSER" ]; then
            echo "Rendered QA fallback browser: $($FALLBACK_BROWSER --version)"
          fi

          npm run qa:frontend
      - name: Upload UI/UX browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myfinhub-ui-ux-${{ github.sha }}
          path: /tmp/myfinhub-ui-ux-qa/*.png
          if-no-files-found: warn
          retention-days: 14
