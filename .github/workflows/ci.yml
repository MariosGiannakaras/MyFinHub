name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm audit --audit-level=high
      - run: npm audit --prefix api --audit-level=high
      - run: npm run check
      - run: npm run check --prefix api
      - name: Recover authentic brand variants
        shell: bash
        run: |
          command -v convert
          mkdir -p tmp/authentic-brand-output
          convert tmp/authentic-rheomiq-icon.png -filter Lanczos -resize 32x32 tmp/authentic-brand-output/icon-32.png
          cp tmp/authentic-rheomiq-icon.png tmp/authentic-brand-output/icon-192.png
          convert tmp/authentic-rheomiq-icon.png -filter Lanczos -resize 512x512 tmp/authentic-brand-output/icon-512.png
          identify tmp/authentic-brand-output/icon-32.png tmp/authentic-brand-output/icon-192.png tmp/authentic-brand-output/icon-512.png
      - name: Upload authentic brand recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authentic-brand-recovery-${{ github.sha }}
          path: tmp/authentic-brand-output/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Rendered frontend QA
        run: |
          npm run dev:web > /tmp/rheomiq-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/qa.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rheomiq-vite.log
            exit 1
          fi
          npm run qa:frontend
