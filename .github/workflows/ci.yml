name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rheomiq-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
