name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - 'visual-qa/**'
  workflow_dispatch:
    inputs:
      final_visual:
        description: Capture and upload the full 216-image final visual acceptance matrix
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm ci --prefix api --prefer-offline --no-audit --no-fund
      - name: Known defect patterns (read-only preflight)
        run: npm run defects:preflight -- --base HEAD^1
      - run: npm run hygiene
      - run: npm run check
      - run: npm run check --prefix api
      - name: Rendered frontend QA
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          npm run dev:web > /tmp/rheomiq-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/qa.html > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/rheomiq-vite.log; exit 1; fi
          PRIMARY_BROWSER="$(command -v chromium || command -v chromium-browser || true)"
          FALLBACK_BROWSER="$(command -v google-chrome || true)"
          if [ -z "$PRIMARY_BROWSER" ]; then echo "Chromium is required for rendered frontend QA in CI."; exit 1; fi
          export MYFINHUB_QA_PRIMARY_BROWSER="$PRIMARY_BROWSER"
          export MYFINHUB_QA_FALLBACK_BROWSER="$FALLBACK_BROWSER"
          export MYFINHUB_QA_REQUIRE_PRIMARY=1
          # Bound simultaneous Chromium CPU load during strict wall-clock QA assertions.
          export MYFINHUB_QA_PARALLELISM=2
          mkdir -p /tmp/myfinhub-qa-browser-bin
          cat > /tmp/myfinhub-qa-browser-bin/google-chrome <<'BROWSER_WRAPPER'
          #!/usr/bin/env bash
          browser="${MYFINHUB_QA_PRIMARY_BROWSER}"
          if [ "${MYFINHUB_QA_USE_FALLBACK:-0}" = "1" ] && [ "${MYFINHUB_QA_REQUIRE_PRIMARY:-0}" != "1" ] && [ -n "${MYFINHUB_QA_FALLBACK_BROWSER:-}" ]; then browser="${MYFINHUB_QA_FALLBACK_BROWSER}"; fi
          exec "$browser" --disable-dev-shm-usage "$@"
          BROWSER_WRAPPER
          chmod +x /tmp/myfinhub-qa-browser-bin/google-chrome
          export PATH="/tmp/myfinhub-qa-browser-bin:$PATH"
          echo "Rendered QA enforced primary browser: $($PRIMARY_BROWSER --version)"
          npm run qa:frontend
      - run: npm audit --audit-level=high
      - run: npm audit --prefix api --audit-level=high
      - name: Upload rendered UI QA evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myfinhub-visual-qa-${{ github.sha }}
          path: |
            .qa-artifacts/visual/**/*.png
            .qa-artifacts/visual/**/*.json
            /tmp/myfinhub-settings-tabs-qa/*.png
            /tmp/myfinhub-settings-rules-modal-qa/*.png
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL security analysis
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  webkit:
    name: WebKit compatibility
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/cross-engine-smoke.yml

  performance:
    name: Lighthouse and loading shift
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/performance-smoke.yml

  windows:
    name: Windows installer and lifecycle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/desktop-windows.yml

  windows-first-run:
    name: Windows application-owned first run
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/desktop-first-run.yml

  windows-clean-launch:
    name: Windows clean installed launch
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/desktop-clean-launch.yml

  final-visual:
    name: Optional 216-image visual acceptance
    needs: [validate, codeql, webkit, performance, windows, windows-first-run, windows-clean-launch]
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.final_visual) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.draft == false &&
           contains(github.event.pull_request.labels.*.name, 'final-visual-qa')) }}
    uses: ./.github/workflows/final-visual-qa.yml

  gate:
    name: Unified required gate
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, codeql, webkit, performance, windows, windows-first-run, windows-clean-launch, final-visual]
    env:
      VALIDATE: ${{ needs.validate.result }}
      CODEQL: ${{ needs.codeql.result }}
      WEBKIT: ${{ needs.webkit.result }}
      PERFORMANCE: ${{ needs.performance.result }}
      WINDOWS: ${{ needs.windows.result }}
      FIRST_RUN: ${{ needs.windows-first-run.result }}
      CLEAN_LAUNCH: ${{ needs.windows-clean-launch.result }}
      FINAL_VISUAL: ${{ needs.final-visual.result }}
      DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
      VISUAL_REQUIRED: ${{ (github.event_name == 'workflow_dispatch' && inputs.final_visual) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'final-visual-qa')) }}
    steps:
      - name: Fail closed on failed, cancelled or missing required checks
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          require_success() {
            local name="$1" result="$2"
            echo "$name: $result"
            if [ "$result" != "success" ]; then failures=$((failures+1)); fi
          }
          require_skipped_or_success() {
            local name="$1" result="$2"
            echo "$name: $result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then failures=$((failures+1)); fi
          }
          require_success validate "$VALIDATE"
          require_success codeql "$CODEQL"
          if [ "$DRAFT_PR" = "true" ]; then
            for item in WEBKIT PERFORMANCE WINDOWS FIRST_RUN CLEAN_LAUNCH; do
              # Draft PRs intentionally defer expensive jobs. Even if a job did
              # run successfully due to a later event, this is not a failure.
              require_skipped_or_success "$item" "${!item}"
            done
          else
            require_success webkit "$WEBKIT"
            require_success performance "$PERFORMANCE"
            require_success windows "$WINDOWS"
            require_success windows-first-run "$FIRST_RUN"
            require_success windows-clean-launch "$CLEAN_LAUNCH"
          fi
          if [ "$VISUAL_REQUIRED" = "true" ]; then
            require_success final-visual "$FINAL_VISUAL"
          elif [ "$FINAL_VISUAL" != "skipped" ] && [ "$FINAL_VISUAL" != "success" ]; then
            echo "Unexpected final-visual result: $FINAL_VISUAL"
            failures=$((failures+1))
          fi
          echo "Unified required gate failures: $failures"
          if [ "$failures" -gt 0 ]; then exit 1; fi
