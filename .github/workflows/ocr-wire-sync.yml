name: OCR Quick Entry wiring

on:
  push:
    branches: [feat/188-local-receipt-ocr]
    paths:
      - .github/ocr-wire.trigger

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/188-local-receipt-ocr
          fetch-depth: 0
      - name: Route generic Quick Entry through receipt-aware wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/ContextualQuickAdd.tsx')
          text=p.read_text()
          before="import { QuickAdd, type QuickPrefill } from './QuickAdd';"
          after="import { type QuickPrefill } from './QuickAdd';\nimport { ReceiptAwareQuickAdd } from './ReceiptAwareQuickAdd';"
          assert text.count(before)==1, text.count(before)
          text=text.replace(before,after)
          before="if(context.mode==='generic')return <QuickAdd key={context.token} open={open} data={data} asOf={asOf} initial={initial} initialKind={context.kind||'expense'} prefill={context.prefill||null} motionMode={motionMode} onClose={onClose} onCreate={onCreate} currentBalance={currentBalance}/>;"
          after="if(context.mode==='generic')return <ReceiptAwareQuickAdd key={context.token} open={open} data={data} asOf={asOf} initial={initial} initialKind={context.kind||'expense'} prefill={context.prefill||null} motionMode={motionMode} onClose={onClose} onCreate={onCreate} currentBalance={currentBalance}/>;"
          assert text.count(before)==1, text.count(before)
          p.write_text(text.replace(before,after))
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ContextualQuickAdd.tsx
          git commit -m "feat: wire local receipt inbox into Quick Entry"
          git push origin HEAD:feat/188-local-receipt-ocr
