name: Final Visual QA

# Reusable opt-in acceptance gate. No repository writes or self-triggering commits.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-screenshots:
    name: capture-216-screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Capture complete final visual set
        shell: bash
        run: |
          rm -rf visual-qa
          npm run dev:web > /tmp/myfinhub-final-visual-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/qa.html > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/myfinhub-final-visual-vite.log; exit 1; fi
          export MYFINHUB_QA_PRIMARY_BROWSER="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$MYFINHUB_QA_PRIMARY_BROWSER" ]; then echo "Chromium is required."; exit 1; fi
          export MYFINHUB_UX_EVIDENCE_ROOT="visual-qa/final"
          export MYFINHUB_FINAL_SCREENSHOTS=1
          npm run qa:final-screenshots
          COUNT="$(find visual-qa/final -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 216 ]; then echo "Expected 216 final PNGs, found $COUNT."; exit 1; fi
          EXTRA="$(find visual-qa -type f ! -path 'visual-qa/final/*' -print -quit)"
          if [ -n "$EXTRA" ]; then echo "Unexpected non-final visual evidence: $EXTRA"; exit 1; fi
          if find visual-qa/final -name '*.png' -size 0 | grep -q .; then
            echo "Final screenshot set contains an empty PNG."; exit 1
          fi
      - name: Upload complete immutable visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myfinhub-final-screenshots-${{ github.sha }}
          path: visual-qa/final/
          if-no-files-found: warn
          retention-days: 30
