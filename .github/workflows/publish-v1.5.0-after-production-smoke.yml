# One-time v1.5.0 Windows publication after the Vercel production SHA smoke succeeds.
# workflow_run is evaluated from main; it cannot publish a preview or Draft PR.
name: Publish v1.5.0 after Production Smoke

on:
  workflow_run:
    workflows: [Production Smoke]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: myfinhub-v1.5.0-publication
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    name: tag-and-dispatch-validated-release
    # This was a single-use release publisher, not a permanent production hook.
    # Future docs or production commits must never republish v1.5.0.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'deployment_status' &&
      github.event.workflow_run.head_sha == '0b4e20560908d2378e88ab8746d0bfd9a00e7e01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production release provenance and publish immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: '564'
          VERIFIED_SMOKE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: myfinhub-v1.5.0
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY:?}"
          smoke="$(gh api "repos/$repo/actions/runs/$VERIFIED_SMOKE_RUN")"
          [[ "$(jq -r '.name' <<< "$smoke")" == 'Production Smoke' ]]
          [[ "$(jq -r '.event' <<< "$smoke")" == 'deployment_status' ]]
          [[ "$(jq -r '.conclusion' <<< "$smoke")" == 'success' ]]

          release_pr="$(gh api "repos/$repo/pulls/$RELEASE_PR")"
          [[ "$(jq -r '.merged' <<< "$release_pr")" == 'true' ]] || {
            echo 'Refusing tag: release PR is not merged.'
            exit 1
          }
          merge_sha="$(jq -r '.merge_commit_sha' <<< "$release_pr")"
          main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$merge_sha" == "$main_sha" ]] || {
            echo "Refusing tag: main $main_sha differs from approved release merge $merge_sha."
            exit 1
          }
          merged_at="$(jq -r '.merged_at' <<< "$release_pr")"
          smoke_created="$(jq -r '.created_at' <<< "$smoke")"
          [[ -n "$merged_at" && "$merged_at" != 'null' ]]
          [[ "$smoke_created" > "$merged_at" ]] || {
            echo 'Refusing tag: smoke predates the production release merge.'
            exit 1
          }
          for manifest in package.json desktop/package.json; do
            version="$(gh api "repos/$repo/contents/$manifest?ref=$main_sha" --jq '.content' | tr -d '\n' | base64 --decode | jq -r '.version')"
            [[ "$version" == '1.5.0' ]] || {
              echo "Refusing tag: $manifest does not declare version 1.5.0."
              exit 1
            }
          done
          if gh api "repos/$repo/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'v1.5.0 release already published; no duplicate tag or dispatch.'
            exit 0
          fi
          if existing="$(gh api "repos/$repo/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "$main_sha" ]] || {
              echo 'Refusing to move immutable existing release tag.'
              exit 1
            }
          else
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$main_sha" >/dev/null
            echo "Created immutable $RELEASE_TAG at $main_sha."
          fi

          # GITHUB_TOKEN-created tag pushes do not themselves trigger push workflows.
          # Explicit workflow_dispatch is supported and runs the repository's existing
          # exact-tag ancestry/installer/hash/release checks, not a parallel publisher.
          gh api --method POST "repos/$repo/actions/workflows/desktop-windows.yml/dispatches" -f "ref=$RELEASE_TAG"
          echo "Dispatched existing Windows release gate on $RELEASE_TAG."
