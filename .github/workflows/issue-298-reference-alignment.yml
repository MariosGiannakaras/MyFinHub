name: Issue 298 reference alignment

on:
  push:
    branches: [issue-298-dashboard-redesign]

permissions:
  contents: write

jobs:
  align:
    if: ${{ contains(github.event.head_commit.message, 'run reference alignment') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue298-fidelity.py
      - run: npx vitest run tests/shell-dashboard-hierarchy-source.test.ts tests/account-metadata.test.ts tests/final-ux-reconciliation-source.test.ts tests/time-aware-source.test.ts tests/selectors.test.ts
      - run: npm run security:guard
      - run: npm run build
      - name: Capture aligned Dashboard
        shell: bash
        run: |
          npm run dev:web > /tmp/myfinhub-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5173/qa.html > /dev/null; then break; fi
            sleep 1
          done
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,1000 --virtual-time-budget=10000 --screenshot=/tmp/dashboard-aligned-v5.png 'http://127.0.0.1:5173/qa.html?page=dashboard'
          test -s /tmp/dashboard-aligned-v5.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-298-dashboard-reference-aligned-v5
          path: /tmp/dashboard-aligned-v5.png
          retention-days: 14
      - name: Commit fidelity changes
        shell: bash
        run: |
          cp /tmp/dashboard-aligned-v5.png visual-qa/dashboard/issue-298-dashboard-reference-aligned-desktop-1440x1000.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardPage.tsx src/styles/part48.css visual-qa/dashboard/issue-298-dashboard-reference-aligned-desktop-1440x1000.png
          git commit -m "fix(dashboard): tighten approved-target fidelity (#298) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
