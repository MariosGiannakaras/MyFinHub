name: OCR lockfile sync

on:
  push:
    branches: [feat/188-local-receipt-ocr]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/188-local-receipt-ocr
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload regenerated lockfile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-package-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 2
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize OCR dependencies lockfile"
          git push origin HEAD:feat/188-local-receipt-ocr
