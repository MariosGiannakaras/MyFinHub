version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: framer-motion
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      api-toolchain-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      desktop-toolchain-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: electron
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
