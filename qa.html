<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
    <link rel="icon" href="/brand/icon-192.png"/>
    <title>MyFinHub Frontend QA</title>
    <script type="importmap">
      {"imports":{"/src/qaFixture.ts":"/src/qaApprovedDashboardFixture.ts"}}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params=new URLSearchParams(location.search);
      const settingsApproval=params.get('page')==='settings'&&params.get('state')==='settings-tabs';
      const desktopLockScreen=params.get('screen')==='desktop-lock';
      const desktopUpdateStatus=params.get('desktop-update')||'';
      const desktopFixture=settingsApproval||desktopLockScreen||Boolean(desktopUpdateStatus);
      if(desktopFixture){
        const appLockState={supported:true,enabled:true,idleMinutes:5,failedAttempts:0,retryAfterMs:0};
        const updateStates={
          'up-to-date':{supported:true,currentVersion:'1.3.0',status:'up-to-date',availableVersion:null,progress:100,message:'Η εφαρμογή είναι ενημερωμένη.'},
          available:{supported:true,currentVersion:'1.3.0',status:'available',availableVersion:'1.4.0',progress:0,message:'Η έκδοση 1.4.0 είναι διαθέσιμη για λήψη.'},
          downloading:{supported:true,currentVersion:'1.3.0',status:'downloading',availableVersion:'1.4.0',progress:42,message:'Γίνεται λήψη και έλεγχος της ενημέρωσης.'},
          ready:{supported:true,currentVersion:'1.3.0',status:'ready',availableVersion:'1.4.0',progress:100,message:'Η ενημέρωση επαληθεύτηκε και είναι έτοιμη για εγκατάσταση.'},
          error:{supported:true,currentVersion:'1.3.0',status:'error',availableVersion:'1.4.0',progress:0,message:'Η ενημέρωση δεν ολοκληρώθηκε. Δοκίμασε ξανά.'},
        };
        const updateState=updateStates[desktopUpdateStatus]||updateStates['up-to-date'];
        let lockAttempts=0;
        Object.defineProperty(window,'myFinHubDesktop',{configurable:true,value:Object.freeze({
          getInfo:async()=>({productName:'MyFinHub',version:'1.3.0',packaged:true}),
          getUpdateState:async()=>updateState,
          checkForUpdates:async()=>updateState,
          downloadUpdate:async()=>updateState,
          installUpdate:async()=>updateState,
          onUpdateState:()=>()=>{},
          getAppLockState:async()=>({...appLockState,failedAttempts:lockAttempts}),
          verifyAppPin:async pin=>{
            if(String(pin)==='2468')return {ok:true,...appLockState,failedAttempts:lockAttempts};
            lockAttempts+=1;
            return {ok:false,...appLockState,failedAttempts:lockAttempts,retryAfterMs:lockAttempts>=2?5000:0};
          },
          setAppPin:async()=>({ok:true,...appLockState}),
          setAppLockTimeout:async minutes=>({ok:true,...appLockState,idleMinutes:Number(minutes)||5}),
          disableAppPin:async()=>({ok:true,...appLockState,enabled:false}),
        })});
        const nativeFetch=window.fetch.bind(window);
        const deviceNow=Date.now();
        let deviceRows=[
          {sessionId:'123e4567-e89b-42d3-a456-426614174001',current:true,platform:'windows',label:'Windows · MyFinHub PC',appVersion:'1.3.0',firstSeenAt:new Date(deviceNow-86400000*12).toISOString(),lastSeenAt:new Date(deviceNow-45000).toISOString()},
          {sessionId:'123e4567-e89b-42d3-a456-426614174002',current:false,platform:'android',label:'Android · Pixel',appVersion:'1.0.0',firstSeenAt:new Date(deviceNow-86400000*3).toISOString(),lastSeenAt:new Date(deviceNow-32*60000).toISOString()},
        ];
        window.fetch=async(input,init)=>{
          const href=typeof input==='string'?input:input instanceof URL?input.href:input.url;
          const url=new URL(href,location.origin);
          if(url.origin===location.origin&&url.pathname==='/api/auth/session'){
            return new Response(JSON.stringify({authenticated:true,email:'owner@myfinhub.app'}),{status:200,headers:{'content-type':'application/json'}});
          }
          if(url.origin===location.origin&&url.pathname==='/api/auth/devices'&&(!init?.method||String(init.method).toUpperCase()==='GET')){
            return new Response(JSON.stringify({devices:deviceRows}),{status:200,headers:{'content-type':'application/json'}});
          }
          if(url.origin===location.origin&&url.pathname==='/api/auth/devices'&&String(init?.method||'GET').toUpperCase()==='POST'){
            await new Promise(resolve=>setTimeout(resolve,650));
            return new Response(JSON.stringify({error:{code:'QA_DEVICE_REVOKE_UNAVAILABLE',message:'Synthetic device revoke unavailable'}}),{status:503,headers:{'content-type':'application/json'}});
          }
          return nativeFetch(input,init);
        };
      }
      await import('/src/styles.css');
      await import('/src/styles/approved-workspace-targets.css');
      await import('/src/styles/account-iban-surfaces.css');
      await import('/src/styles/dark-theme-surfaces.css');
      await import('/src/qa.tsx');
      for(let attempt=0;attempt<120&&!document.querySelector('#root>*');attempt+=1){
        await new Promise(resolve=>setTimeout(resolve,16));
      }
      if(!document.querySelector('#root>*'))throw new Error('QA React surface did not mount before document readiness.');
      const approvedEvidence=params.get('page')==='dashboard'&&params.get('motion')==='reduced'&&!params.get('state');
      if(approvedEvidence){
        for(let attempt=0;attempt<120&&!document.querySelector('.privacy-toggle');attempt+=1){
          await new Promise(resolve=>setTimeout(resolve,16));
        }
        const privacyToggle=document.querySelector('.privacy-toggle');
        if(privacyToggle?.getAttribute('aria-pressed')==='false')privacyToggle.click();
        await new Promise(resolve=>setTimeout(resolve,50));
      }
    </script>
  </body>
</html>
