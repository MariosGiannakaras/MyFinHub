<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
    <link rel="icon" href="/brand/icon-192.png"/>
    <title>MyFinHub Frontend QA</title>
    <script type="importmap">
      {"imports":{"/src/qaFixture.ts":"/src/qaApprovedDashboardFixture.ts"}}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      await import('/src/styles.css');
      await import('/src/styles/part47.css');
      await import('/src/qa.tsx');
      for(let attempt=0;attempt<120&&!document.querySelector('#root>*');attempt+=1){
        await new Promise(resolve=>setTimeout(resolve,16));
      }
      if(!document.querySelector('#root>*'))throw new Error('QA React surface did not mount before document readiness.');
      if(new URLSearchParams(location.search).get('page')==='dashboard'){
        for(let attempt=0;attempt<120&&!document.querySelector('.privacy-toggle');attempt+=1){
          await new Promise(resolve=>setTimeout(resolve,16));
        }
        const privacyToggle=document.querySelector('.privacy-toggle');
        if(privacyToggle?.getAttribute('aria-pressed')==='false')privacyToggle.click();
        await new Promise(resolve=>setTimeout(resolve,50));
      }
    </script>
  </body>
</html>
